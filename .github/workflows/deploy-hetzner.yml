name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" bash -s <<REMOTE
          set -euo pipefail
          cd /var/www/gekuendigt-abfindung

          echo "== Fetch =="
          git fetch --all --prune
          git reset --hard "$SHA"

          echo "== Deps =="
          NODE_ENV=development npm ci --no-audit --no-fund

          echo "== Build =="
          npm run build

          echo "== Reload =="
          pm2 reload gekuendigt-abfindung --update-env
          pm2 save

          echo "== Deployed commit =="
          git log -1 --oneline
          REMOTE

      - name: Smoke test
        id: smoke
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L https://www.gekuendigt-abfindung.de/)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Smoke test failed: site did not return 200"
          exit 1

      - name: Checkout (for IndexNow script)
        if: success()
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node (for IndexNow script)
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # IndexNow informiert Bing + Yandex (und mittelbar DuckDuckGo) direkt
      # nach jedem Deploy über geänderte URLs. Ohne diesen Schritt kennen
      # diese Suchmaschinen Content-Updates erst nach dem nächsten Crawl –
      # teils Tage später. Google bleibt am normalen Crawl.
      # Der Key wird automatisch aus public/<KEY>.txt gelesen – kein Secret
      # nötig, weil der Key ohnehin öffentlich auf der Domain liegt.
      - name: IndexNow ping
        if: success()
        env:
          INDEXNOW_HOST: www.gekuendigt-abfindung.de
        run: node scripts/indexnow-submit.mjs
